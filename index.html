<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background:linear-gradient(to right, #EE9CA7 , #82b6a5, #e9e9e9);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-shadow: rgb(9, 7, 7);
        }

        .card {
            background: linear-gradient(to right, #FFB5B5, #B5FFC9  );
            padding: 30px;
            border-radius: 20px;
            width: 300px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(206, 23, 23, 0.2);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 2px solid #3498db;
            outline: none;
        }

        .operations button {
            margin: 8px;
            padding: 12px;
            border-radius: 50%;
            border: none;
            background: #af7aa5;
            font-size: 16px;
            cursor: pointer;
        }

        .numbers button {
            margin: 8px;
            padding: 15px;
            border-radius: 50%;
            border: none;
            background: #94686c;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.1);
        }

        .result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="card">
        <h2>Calculator</h2>

        <input type="number" id="num1" placeholder="Enter first number">
        <input type="number" id="num2" placeholder="Enter second number">

        <div class="operations">
            <button onclick="calculate('+')">Add</button>
            <button onclick="calculate('-')">Sub</button>
            <button onclick="calculate('*')">Mul</button>
            <button onclick="calculate('/')">Div</button>
        </div>

        <div class="numbers">
            <button onclick="insert(1)">1</button>
            <button onclick="insert(2)">2</button>
            <button onclick="insert(3)">3</button><br>
            <button onclick="insert(4)">4</button>
            <button onclick="insert(5)">5</button>
            <button onclick="insert(6)">6</button><br>
            <button onclick="insert(7)">7</button>
            <button onclick="insert(8)">8</button>
            <button onclick="insert(9)">9</button>
        </div>

        <div class="result" id="result">Result: </div>
    </div>

    <script>
        let activeInput = "num1";

        document.getElementById("num1").onclick = () => activeInput = "num1";
        document.getElementById("num2").onclick = () => activeInput = "num2";

        function insert(num) {
            let field = document.getElementById(activeInput);
            field.value += num;
        }

        function calculate(op) {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            let result;

            if (op === '+') result = a + b;
            else if (op === '-') result = a - b;
            else if (op === '*') result = a * b;
            else if (op === '/') result = b !== 0 ? a / b : "Cannot divide by 0";

            document.getElementById("result").innerText = "Result: " + result;
        }
    </script>

</body>

</html>
